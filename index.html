
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta name="theme-color" content="#718573">

  <title>Fotos do Nosso Casamento</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #e6ede3;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #e6ede3;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #536957;
      font-family: Georgia, "Times New Roman", serif;
    }

    .fallback a {
      color: #536957;
    }
  </style>
</head>

<body>

  <div class="fallback">
    <p>
      Abrindo nossa página de fotos...
      <br><br>
      Se ela não carregar,
      <a
        href="https://script.google.com/macros/s/AKfycbxbfYDMLejkM5nuevVH87PGcf3IF38nSsU1s4NqggV-r_kJh1Yk7DJE708m66nPMD6b5A/exec"
        target="_blank"
        rel="noopener noreferrer"
      >
        clique aqui para acessar
      </a>.
    </p>
  </div>

  <iframe
    title="Fotos do nosso casamento"
    src="https://script.google.com/macros/s/AKfycbxbfYDMLejkM5nuevVH87PGcf3IF38nSsU1s4NqggV-r_kJh1Yk7DJE708m66nPMD6b5A/exec"
    allow="clipboard-write"
  ></iframe>

</body>
</html>
